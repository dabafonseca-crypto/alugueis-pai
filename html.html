<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Aluguéis">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Extrato e Carnês</title>
  <style>
    :root{
      --bg:#f5f6f8; --card:#fff; --text:#17212b; --muted:#6b7280;
      --line:#e7e9ee; --blue:#2457ff; --green:#17853c; --red:#c62828;
      --amber:#9a6700; --green-bg:#edf8f1; --amber-bg:#fff7df; --radius:16px;
    }
    *{box-sizing:border-box}
    html{background:var(--bg)}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,select{font:inherit}
    .app{width:min(100%,760px);margin:0 auto;padding:16px 14px 92px}
    header{margin-bottom:14px}
    h1{margin:0;font-size:1.45rem;font-weight:850;letter-spacing:-.02em}
    #atualizado{margin-top:4px;color:var(--muted);font-size:.78rem}
    .tab-page{display:none}.tab-page.active{display:block}
    .card{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)
    }

    .saldo{padding:16px;margin-bottom:10px}
    .saldo-label{color:var(--muted);font-size:.86rem;font-weight:650}
    .saldo-valor{margin-top:2px;font-size:2rem;font-weight:900;letter-spacing:-.04em}
    .negativo{color:var(--red)!important}.positivo{color:var(--green)!important}
    .mes{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;margin-top:13px}
    .mes button,.mes select{
      height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text)
    }
    .mes button{font-size:1.4rem;font-weight:800}.mes button:disabled{opacity:.3}
    .mes select{padding:0 8px;text-align:center;font-weight:750}
    .movimentos{margin-bottom:10px}
    .mov{
      display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;
      padding:9px 11px 7px;border-bottom:1px solid var(--line);align-items:start
    }
    .mov:last-child{border-bottom:0}
    .mov-data{color:var(--muted);font-size:.78rem;font-weight:650;padding-top:2px}
    .mov-desc{min-width:0;font-size:.92rem;font-weight:650;overflow-wrap:anywhere}
    .mov-desc.vazia{color:var(--muted);font-weight:500;font-style:italic}
    .mov-valor{text-align:right;white-space:nowrap;font-size:.91rem;font-weight:850}
    .mov-saldo{grid-column:2/4;text-align:right;color:var(--muted);font-size:.7rem}

    .carne{margin-bottom:10px}
    .carne-cab{padding:14px}
    .carne-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
    .nome{margin:0;font-size:1.02rem;font-weight:900;line-height:1.22}
    .valor{margin-top:4px;font-size:1.25rem;font-weight:900}
    .tag{
      display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;
      font-size:.7rem;font-weight:850;white-space:nowrap
    }
    .tag-pago{background:var(--green-bg);color:var(--green)}
    .tag-pendente{background:var(--amber-bg);color:var(--amber)}
    .tag-neutro{background:#eef1f5;color:#53606f}
    .info{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
    .info-item{padding:8px 9px;border-radius:10px;background:#f8f9fb}
    .info-item span{display:block;color:var(--muted);font-size:.69rem;font-weight:650}
    .info-item strong{display:block;margin-top:2px;font-size:.87rem}
    .resumo{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .proxima{margin-top:9px;padding:9px 10px;border-radius:10px;background:#f8f9fb;font-size:.84rem}
    .sem-carne{margin-top:10px;color:var(--muted);font-size:.84rem}
    .ver{
      width:100%;min-height:44px;border:0;border-top:1px solid var(--line);
      background:#fff;color:var(--blue);font-weight:850
    }
    .parcelas{display:none;border-top:1px solid var(--line);background:#fbfcfd}
    .parcelas.aberta{display:block}
    .parcela{
      display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 13px;
      border-bottom:1px solid var(--line);align-items:center
    }
    .parcela:last-child{border-bottom:0}
    .parcela strong{font-size:.88rem}
    .parcela small{display:block;margin-top:2px;color:var(--muted);font-size:.74rem}
    .parcela-direita{text-align:right}
    .parcela-direita .pv{margin-bottom:4px;font-size:.82rem;font-weight:800}

    .vazio,.erro{padding:24px 16px;text-align:center;color:var(--muted)}
    .erro strong{display:block;color:var(--text);font-size:1rem;margin-bottom:5px}
    .carregando{padding:26px 16px;text-align:center;color:var(--muted)}
    nav{
      position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);
      border-top:1px solid var(--line);
      padding:7px 10px calc(7px + env(safe-area-inset-bottom))
    }
    .nav-inner{width:min(100%,760px);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tab{height:52px;border:0;border-radius:13px;background:transparent;color:#667085;font-weight:850}
    .tab.active{color:var(--blue);background:#edf3ff}

    @media (min-width:650px){
      .app{padding-left:20px;padding-right:20px}
      .info{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1 id="titulo">Extrato</h1>
      <div id="atualizado">Carregando...</div>
    </header>

    <section id="pgExtrato" class="tab-page active">
      <div class="card saldo">
        <div class="saldo-label" id="saldoLabel">Saldo atual</div>
        <div class="saldo-valor" id="saldoValor">—</div>
        <div class="mes">
          <button id="mesAnterior" type="button" aria-label="Mês anterior">‹</button>
          <select id="seletorMes" aria-label="Selecionar mês"></select>
          <button id="mesSeguinte" type="button" aria-label="Mês seguinte">›</button>
        </div>
      </div>
      <div class="card movimentos" id="listaMovimentos">
        <div class="carregando">Carregando...</div>
      </div>
    </section>

    <section id="pgCarnes" class="tab-page">
      <div id="listaCarnes">
        <div class="card carregando">Carregando...</div>
      </div>
    </section>
  </main>

  <nav>
    <div class="nav-inner">
      <button id="btnExtrato" class="tab active" type="button">Extrato</button>
      <button id="btnCarnes" class="tab" type="button">Carnês</button>
    </div>
  </nav>

<script>
const SUPABASE_URL = 'https://gjyrrrtzoouzfgyvevim.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Dw1hXY6atadiUU2VSRUDbA_bZ7CNjG5';

const estado={dados:null,meses:[],mesIndex:-1};
const el=id=>document.getElementById(id);

function esc(v){
  return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;')
    .replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
}
function numero(v){
  if(typeof v==='number') return Number.isFinite(v)?v:null;
  if(v===null||v===undefined||v==='') return null;
  let t=String(v).trim().replace(/[R$\s]/gi,'');
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
  const n=Number(t);return Number.isFinite(n)?n:null;
}
function dinheiro(v){
  const n=numero(v);if(n===null)return '—';
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function partesData(v){
  const m=String(v||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/);
  if(!m)return null;let a=Number(m[3]);if(a<100)a+=2000;
  return {d:Number(m[1]),m:Number(m[2]),a};
}
function chaveMes(mov){
  if(/^\d{4}-\d{2}-\d{2}$/.test(String(mov.data_iso||'')))return mov.data_iso.slice(0,7);
  const p=partesData(mov.data);return p?`${p.a}-${String(p.m).padStart(2,'0')}`:null;
}
function nomeMes(chave){
  const [a,m]=chave.split('-').map(Number);
  const s=new Date(a,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function formatarAtualizacao(v){
  if(!v)return '';
  const d=new Date(v);if(Number.isNaN(d.getTime()))return '';
  return 'Atualizado em '+d.toLocaleString('pt-BR',{
    day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'
  });
}

async function carregar(){
  try{
    const url=`${SUPABASE_URL}/rest/v1/alugueis_app?id=eq.principal&select=dados,atualizado_em`;
    const r=await fetch(url,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY},cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();
    if(!rows?.[0]?.dados)throw new Error('Sem dados');
    estado.dados=rows[0];
    localStorage.setItem('alugueis_pai_ultimo_snapshot',JSON.stringify(rows[0]));
    renderTudo();
  }catch(e){
    const cache=localStorage.getItem('alugueis_pai_ultimo_snapshot');
    if(cache){
      try{
        estado.dados=JSON.parse(cache);
        renderTudo();
        el('atualizado').textContent='Últimos dados salvos neste aparelho';
        return;
      }catch(_){}
    }
    mostrarErro();
  }
}

function mostrarErro(){
  el('atualizado').textContent='';
  el('listaMovimentos').innerHTML=
    '<div class="erro"><strong>Sem conexão</strong>Tente novamente mais tarde.</div>';
  el('listaCarnes').innerHTML=
    '<div class="card erro"><strong>Sem conexão</strong>Tente novamente mais tarde.</div>';
}

function prepararMeses(){
  const movs=estado.dados?.dados?.extrato?.movimentos||[];
  const meses=[];
  for(const m of movs){const k=chaveMes(m);if(k&&!meses.includes(k))meses.push(k)}
  meses.sort();estado.meses=meses;estado.mesIndex=meses.length-1;
  el('seletorMes').innerHTML=meses.map((m,i)=>`<option value="${i}">${esc(nomeMes(m))}</option>`).join('');
  el('seletorMes').value=String(estado.mesIndex);
}

function renderExtrato(){
  const ext=estado.dados?.dados?.extrato||{};
  const chave=estado.meses[estado.mesIndex];
  const movs=(ext.movimentos||[]).filter(m=>chaveMes(m)===chave);
  const ultimoMes=estado.mesIndex===estado.meses.length-1;

  let saldo=null;
  if(ultimoMes){
    saldo=ext.saldo_atual;el('saldoLabel').textContent='Saldo atual';
  }else{
    const ult=[...movs].reverse().find(m=>m.saldo!==null&&m.saldo!==undefined);
    saldo=ult?ult.saldo:null;el('saldoLabel').textContent='Saldo ao fim do mês';
  }

  const s=el('saldoValor');
  s.textContent=dinheiro(saldo);
  s.className='saldo-valor'+(numero(saldo)<0?' negativo':'');

  el('mesAnterior').disabled=estado.mesIndex<=0;
  el('mesSeguinte').disabled=estado.mesIndex>=estado.meses.length-1;

  if(!movs.length){
    el('listaMovimentos').innerHTML='<div class="vazio">Nenhum lançamento neste mês.</div>';
    return;
  }

  el('listaMovimentos').innerHTML=movs.map(m=>{
    const v=numero(m.valor),sal=numero(m.saldo),desc=String(m.lancamento||'').trim();
    return `<div class="mov">
      <div class="mov-data">${esc(m.data||'—')}</div>
      <div class="mov-desc ${desc?'':'vazia'}">${esc(desc||'Sem descrição')}</div>
      <div class="mov-valor ${v<0?'negativo':v>0?'positivo':''}">${esc(dinheiro(m.valor))}</div>
      <div class="mov-saldo ${sal<0?'negativo':''}">Saldo: <strong>${esc(dinheiro(m.saldo))}</strong></div>
    </div>`;
  }).join('');
}

function statusTag(status){
  const s=String(status||'').toUpperCase();
  if(s==='PAGO')return '<span class="tag tag-pago">Pago</span>';
  if(s==='PENDENTE')return '<span class="tag tag-pendente">Pendente</span>';
  return `<span class="tag tag-neutro">${esc(status||'—')}</span>`;
}

function renderCarnes(){
  const contratos=estado.dados?.dados?.alugueis?.contratos||[];
  if(!contratos.length){
    el('listaCarnes').innerHTML='<div class="card vazio">Nenhum contrato.</div>';return;
  }

  el('listaCarnes').innerHTML=contratos.map((c,i)=>{
    const parcelas=Array.isArray(c.parcelas)?c.parcelas:[];
    const pagas=parcelas.filter(p=>String(p.status||'').toUpperCase()==='PAGO').length;
    const pend=parcelas.filter(p=>String(p.status||'').toUpperCase()==='PENDENTE').length;
    const prox=parcelas.find(p=>String(p.status||'').toUpperCase()==='PENDENTE');

    let bloco='';
    if(c.tem_efi){
      if(parcelas.length){
        bloco=`<div class="resumo">
          <span class="tag tag-pago">${pagas} ${pagas===1?'paga':'pagas'}</span>
          <span class="tag tag-pendente">${pend} ${pend===1?'pendente':'pendentes'}</span>
        </div>
        ${prox?`<div class="proxima">Próxima: <strong>${esc(prox.vencimento||'—')}</strong> · ${esc(prox.valor||dinheiro(c.valor_planilha))}</div>`:
        `<div class="proxima"><strong>Nenhuma parcela pendente.</strong></div>`}`;
      }else{
        bloco='<div class="sem-carne">Situação do carnê indisponível nesta atualização.</div>';
      }
    }else{
      bloco='<div class="sem-carne">Sem carnê online.</div>';
    }

    const parcelasHtml=parcelas.map(p=>`<div class="parcela">
      <div><strong>Parcela ${esc(p.parcela??'—')}</strong><small>Vencimento: ${esc(p.vencimento||'—')}</small></div>
      <div class="parcela-direita"><div class="pv">${esc(p.valor||dinheiro(c.valor_planilha))}</div>${statusTag(p.status)}</div>
    </div>`).join('');

    return `<article class="card carne">
      <div class="carne-cab">
        <div class="carne-topo">
          <div><h2 class="nome">${esc(c.nome_planilha||'Sem nome')}</h2><div class="valor">${esc(dinheiro(c.valor_planilha))}</div></div>
          ${c.tem_efi?'<span class="tag tag-neutro">Carnê</span>':''}
        </div>
        <div class="info">
          <div class="info-item"><span>Pagamento</span><strong>Dia ${esc(c.data_pagamento||'—')}</strong></div>
          <div class="info-item"><span>Fim do contrato</span><strong>${esc(c.fim_contrato||'—')}</strong></div>
          ${c.tem_efi?`<div class="info-item"><span>Parcelas</span><strong>${esc(c.total_parcelas??parcelas.length)}</strong></div>`:''}
        </div>
        ${bloco}
      </div>
      ${c.tem_efi&&parcelas.length?`
        <button class="ver" data-alvo="p-${i}" type="button">Ver parcelas</button>
        <div class="parcelas" id="p-${i}">${parcelasHtml}</div>`:''}
    </article>`;
  }).join('');

  document.querySelectorAll('.ver').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const alvo=document.getElementById(btn.dataset.alvo);
      const aberta=alvo.classList.toggle('aberta');
      btn.textContent=aberta?'Ocultar parcelas':'Ver parcelas';
    });
  });
}

function renderTudo(){
  el('atualizado').textContent=formatarAtualizacao(estado.dados?.atualizado_em);
  prepararMeses();renderExtrato();renderCarnes();
}

function mudarAba(aba){
  const extrato=aba==='extrato';
  el('pgExtrato').classList.toggle('active',extrato);
  el('pgCarnes').classList.toggle('active',!extrato);
  el('btnExtrato').classList.toggle('active',extrato);
  el('btnCarnes').classList.toggle('active',!extrato);
  el('titulo').textContent=extrato?'Extrato':'Carnês';
  window.scrollTo({top:0,behavior:'instant'});
}

el('btnExtrato').addEventListener('click',()=>mudarAba('extrato'));
el('btnCarnes').addEventListener('click',()=>mudarAba('carnes'));
el('mesAnterior').addEventListener('click',()=>{
  if(estado.mesIndex>0){estado.mesIndex--;el('seletorMes').value=String(estado.mesIndex);renderExtrato()}
});
el('mesSeguinte').addEventListener('click',()=>{
  if(estado.mesIndex<estado.meses.length-1){estado.mesIndex++;el('seletorMes').value=String(estado.mesIndex);renderExtrato()}
});
el('seletorMes').addEventListener('change',()=>{estado.mesIndex=Number(el('seletorMes').value);renderExtrato()});

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden) carregar()});
carregar();
</script>
</body>
</html>
